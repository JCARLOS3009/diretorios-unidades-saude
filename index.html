<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gerenciador de Unidades de Saúde</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #e0f2f1, #b2dfdb);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    max-width: 820px;
    width: 100%;
    padding: 32px;
  }

  header h1 { color: #00695c; font-size: 1.6rem; margin-bottom: 8px; }
  header p { color: #555; font-size: 0.95rem; margin-bottom: 24px; }

  .controls {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 20px; padding: 16px;
    background: #f1f8e9; border-radius: 10px;
  }

  .status { font-size: 0.85rem; color: #558b2f; font-weight: 500; }

  .form-criar { display: flex; gap: 10px; margin-bottom: 20px; }

  .form-criar input {
    flex: 1; padding: 12px 14px; border: 2px solid #cfd8dc;
    border-radius: 8px; font-size: 1rem; transition: border-color 0.2s;
  }

  .form-criar input:focus { outline: none; border-color: #00796b; }

  .form-detalhes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 28px;
    padding: 18px;
    background: #f9fbe7;
    border-radius: 10px;
    border-left: 4px solid #43a047;
  }

  .form-detalhes .campo { display: flex; flex-direction: column; gap: 6px; }
  .form-detalhes .campo.largura-total { grid-column: 1 / -1; }

  .form-detalhes label {
    font-size: 0.78rem;
    font-weight: 700;
    color: #33691e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-detalhes input {
    padding: 10px 12px;
    border: 2px solid #cfd8dc;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    background: #fff;
  }

  .form-detalhes input:focus { outline: none; border-color: #00796b; }

  .btn {
    border: none; border-radius: 8px; padding: 12px 20px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary { background: #00796b; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #00695c; }

  .btn-success { background: #43a047; color: #fff; }
  .btn-success:hover:not(:disabled) { background: #388e3c; }

  .lista h2 {
    font-size: 1.15rem; color: #00695c; margin-bottom: 14px;
    border-bottom: 2px solid #b2dfdb; padding-bottom: 8px;
  }

  #listaUnidades { list-style: none; }

  #listaUnidades li {
    display: flex; align-items: center; justify-content: space-between;
    background: #f9fbe7; border-left: 4px solid #43a047;
    padding: 12px 16px; border-radius: 8px; margin-bottom: 10px;
    animation: slideIn 0.3s ease;
  }

  #listaUnidades .info { display: flex; flex-direction: column; gap: 4px; }
  #listaUnidades .nome { font-weight: 600; color: #33691e; }
  #listaUnidades .subpastas { font-size: 0.8rem; color: #777; }
  #listaUnidades .detalhes { font-size: 0.78rem; color: #666; }

  .vazio { text-align: center; color: #999; font-style: italic; padding: 20px; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #00695c; color: #fff; padding: 14px 22px;
    border-radius: 8px; font-weight: 500; opacity: 0;
    transform: translateY(20px); transition: all 0.3s;
    pointer-events: none; max-width: 320px;
    z-index: 1000;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.erro { background: #c62828; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏥 Gerenciador de Unidades de Saúde</h1>
      <p>Preencha os dados abaixo e crie a pasta da unidade com subpastas e documentos Word já preenchidos.</p>
    </header>

    <section class="controls">
      <button id="btnSelecionarPasta" class="btn btn-primary">📁 Selecionar pasta raiz</button>
      <span id="statusPasta" class="status">Nenhuma pasta selecionada</span>
    </section>

    <section class="form-criar">
      <input type="text" id="nomeUnidade" placeholder="Nome da unidade de saúde (será o nome da pasta)" maxlength="80" />
    </section>

    <section class="form-detalhes">
      <div class="campo">
        <label for="campoNumeroCI">Nº do CI</label>
        <input type="text" id="campoNumeroCI" placeholder="Ex.: 774-2026" maxlength="20" />
      </div>

      <div class="campo">
        <label for="campoData">Data (DD/MM/AAAA)</label>
        <input type="text" id="campoData" placeholder="Ex.: 16/11/2026" maxlength="10" />
      </div>

      <div class="campo">
        <label for="campoLote">Lote (ATA)</label>
        <input type="text" id="campoLote" placeholder="Ex.: 01" maxlength="10" />
      </div>

      <div class="campo">
        <label for="campoPlanilha">Planilha Orçamentária</label>
        <input type="text" id="campoPlanilha" placeholder="Ex.: 16001T" maxlength="30" />
      </div>

      <div class="campo largura-total">
        <label for="campoProcesso">Processo</label>
        <input type="text" id="campoProcesso" placeholder="Nº do processo" maxlength="80" />
      </div>

      <div class="campo largura-total">
        <label for="campoObjeto">Objeto</label>
        <input type="text" id="campoObjeto" placeholder="Objeto do processo" maxlength="200" />
      </div>

      <div class="campo largura-total">
        <label for="campoOrgao">Órgão interessado</label>
        <input type="text" id="campoOrgao" placeholder="Órgão interessado" maxlength="200" />
      </div>

      <div class="campo largura-total">
        <label for="campoEndereco">Endereço da obra</label>
        <input type="text" id="campoEndereco" placeholder="Rua, número, bairro, cidade - UF" maxlength="200" />
      </div>

      <div class="campo largura-total">
        <label for="campoServico">Serviço a ser executado</label>
        <input type="text" id="campoServico" placeholder="Ex.: Lavagem fachada próx. parquinho e comp. cobertura fibrocimento" maxlength="200" />
      </div>

      <div class="campo">
        <label for="campoValor">Valor (R$)</label>
        <input type="text" id="campoValor" placeholder="Ex.: 31.577,70" maxlength="50" />
      </div>

      <div class="campo">
        <label for="campoPrazo">Prazo (dias)</label>
        <input type="text" id="campoPrazo" placeholder="Ex.: 15" maxlength="20" />
      </div>

      <div class="campo">
        <label for="campoFiscal">Nome do fiscal</label>
        <input type="text" id="campoFiscal" placeholder="Ex.: Frede Muniz" maxlength="120" />
      </div>

      <div class="campo">
        <label for="campoEmpresa">Empresa executora</label>
        <input type="text" id="campoEmpresa" placeholder="Ex.: VOLQUE" maxlength="120" />
      </div>

      <div class="campo">
        <label for="campoCodigoObra">Código da obra</label>
        <input type="text" id="campoCodigoObra" placeholder="Ex.: 24391 E" maxlength="50" />
      </div>

      <div class="campo">
        <label for="campoDesconto">Desconto (%)</label>
        <input type="text" id="campoDesconto" placeholder="Ex.: 25,00" maxlength="20" />
      </div>
    </section>

    <section class="form-criar">
      <button id="btnCriar" class="btn btn-success" disabled style="width:100%;">➕ Criar Unidade e Gerar Documentos</button>
    </section>

    <section class="lista">
      <h2>Unidades criadas</h2>
      <ul id="listaUnidades"></ul>
      <p id="vazio" class="vazio">Nenhuma unidade criada ainda.</p>
    </section>

    <div id="toast" class="toast"></div>
  </div>

<script>
// ============================================
// Gerenciador de Unidades de Saúde - v6
// Cabeçalho da CI ajustado conforme o arquivo real
// ============================================

const BRASAO_BAHIA_BASE64 = "iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pVUAAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH5QwREQ0Z9w7n3gAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkL+teAAAAGklEQVR42u3BAQEAAACCIP+vbkhAAQAAAAAAAAAA4G0IAAH8Wv26AAAAAElFTkSuQmCC";

const estado = { pastaRaiz: null, unidades: [] };

const btnSelecionarPasta = document.getElementById('btnSelecionarPasta');
const btnCriar = document.getElementById('btnCriar');
const inputNome = document.getElementById('nomeUnidade');
const statusPasta = document.getElementById('statusPasta');
const listaUnidades = document.getElementById('listaUnidades');
const vazio = document.getElementById('vazio');
const toast = document.getElementById('toast');

const campoEndereco = document.getElementById('campoEndereco');
const campoServico = document.getElementById('campoServico');
const campoValor = document.getElementById('campoValor');
const campoPrazo = document.getElementById('campoPrazo');
const campoFiscal = document.getElementById('campoFiscal');
const campoEmpresa = document.getElementById('campoEmpresa');
const campoCodigoObra = document.getElementById('campoCodigoObra');
const campoDesconto = document.getElementById('campoDesconto');
const campoProcesso = document.getElementById('campoProcesso');
const campoObjeto = document.getElementById('campoObjeto');
const campoOrgao = document.getElementById('campoOrgao');
const campoLote = document.getElementById('campoLote');
const campoNumeroCI = document.getElementById('campoNumeroCI');
const campoData = document.getElementById('campoData');
const campoPlanilha = document.getElementById('campoPlanilha');

const SUBPASTAS = ['Documentos PDF', 'Documentos Word'];

// ============================================
// Helpers WordprocessingML
// ============================================

function escaparXML(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function run(texto, opts = {}) {
  const props = [];
  if (opts.negrito) props.push('<w:b/>');
  if (opts.italico) props.push('<w:i/>');
  if (opts.tamanho) props.push(`<w:sz w:val="${opts.tamanho * 2}"/>`);
  if (opts.fonte) props.push(`<w:rFonts w:ascii="${opts.fonte}" w:hAnsi="${opts.fonte}"/>`);
  const rPr = props.length ? `<w:rPr>${props.join('')}</w:rPr>` : '';
  return `<w:r>${rPr}<w:t xml:space="preserve">${escaparXML(texto)}</w:t></w:r>`;
}

function paragrafo(runs, opts = {}) {
  const props = [];
  if (opts.alinhamento) {
    const map = { left: 'left', center: 'center', right: 'right', justify: 'both' };
    props.push(`<w:jc w:val="${map[opts.alinhamento] || opts.alinhamento}"/>`);
  }
  if (opts.espacoDepois !== undefined) props.push(`<w:spacing w:after="${opts.espacoDepois}"/>`);
  if (opts.espacoAntes !== undefined) props.push(`<w:spacing w:before="${opts.espacoAntes}"/>`);
  const pPr = props.length ? `<w:pPr>${props.join('')}</w:pPr>` : '';
  const conteudo = Array.isArray(runs) ? runs.join('') : runs;
  return `<w:p>${pPr}${conteudo}</w:p>`;
}

function tabelaCustomizada(linhas, larguraTotal, colunas) {
  const gridCols = colunas.map(w => `<w:gridCol w:w="${w}"/>`).join('');
  const bordas = `
    <w:tblBorders>
      <w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/>
    </w:tblBorders>`;
  const tblPr = `<w:tblPr><w:tblW w:w="${larguraTotal}" w:type="dxa"/>${bordas}</w:tblPr>`;

  const rowsXml = linhas.map((celulas) => {
    const cellsXml = celulas.map((cel, idx) => {
      const w = colunas[idx] || Math.floor(larguraTotal / celulas.length);
      const conteudo = typeof cel === 'string'
        ? paragrafo(run(cel))
        : paragrafo(cel.runs, cel.opts || {});
      return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr>${conteudo}</w:tc>`;
    }).join('');
    return `<w:tr>${cellsXml}</w:tr>`;
  }).join('');

  return `<w:tbl>${tblPr}<w:tblGrid>${gridCols}</w:tblGrid>${rowsXml}</w:tbl>`;
}

const IMG_XML = `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><wp:extent cx="1200000" cy="1200000"/><wp:docPr id="1" name="Brasao"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="1" name="Brasao.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImage1" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="1200000" cy="1200000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;

// ============================================
// 1. CABEÇALHO DO DESPACHO (Sem bordas)
// ============================================
function montarCabecalhoDespacho() {
  const tblPr = `<w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders><w:top w:val="none"/><w:left w:val="none"/><w:bottom w:val="none"/><w:right w:val="none"/><w:insideH w:val="none"/><w:insideV w:val="none"/></w:tblBorders></w:tblPr>`;
  const gridCols = `<w:gridCol w:w="2000"/><w:gridCol w:w="7000"/>`;
  
  const textos = `
    ${paragrafo(run('GOVERNO DO ESTADO DA BAHIA', { negrito: true, italico: true, tamanho: 11 }), { espacoDepois: 0 })}
    ${paragrafo(run('SECRETARIA DA SAÚDE - SESAB', { negrito: false, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run('COORDENAÇÃO DE ENGENHARIA E MANUTENÇÃO - SESAB/GAB/CEIRF/CEM', { negrito: false, tamanho: 9 }), { espacoDepois: 0 })}
  `;
  
  const row = `<w:tr>
    <w:tc><w:tcPr><w:tcW w:w="2000" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${IMG_XML}</w:tc>
    <w:tc><w:tcPr><w:tcW w:w="7000" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${textos}</w:tc>
  </w:tr>`;

  return `<w:tbl>${tblPr}<w:tblGrid>${gridCols}</w:tblGrid>${row}</w:tbl>`;
}

// ============================================
// 2. CABEÇALHO DA CI (Conforme o arquivo real)
// ============================================
function montarCabecalhoCI(d) {
  const numero = d.numeroCI || '774/2026';
  const data = d.dataCI || '16/11/2026';
  
  const colunas = [1600, 5400, 2000]; // Brasão | Textos | Dados
  const gridCols = colunas.map(w => `<w:gridCol w:w="${w}"/>`).join('');

  // Textos institucionais (conforme o documento original extraído)
  const textosInst = `
    ${paragrafo(run('Governo do Estado da Bahia', { negrito: false, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run('Secretaria Estadual de Saúde - SESAB', { negrito: false, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run('Coordenação Executiva de Infraestrutura da Rede Física - CEIRF', { negrito: false, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run('Coordenação de Engenharia e Manutenção - CEM', { negrito: false, tamanho: 10 }), { espacoDepois: 0 })}
  `;

  // Célula da direita (Nº, Data, Folha) - 3 sub-linhas
  const textosDir = `
    ${paragrafo(run('Nº', { negrito: true, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run(`${numero}`, { negrito: false, tamanho: 10 }), { espacoDepois: 60 })}
    ${paragrafo(run('DATA:', { negrito: true, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run(`${data}`, { negrito: false, tamanho: 10 }), { espacoDepois: 60 })}
    ${paragrafo(run('FOLHA Nº:', { negrito: true, tamanho: 10 }), { espacoDepois: 0 })}
    ${paragrafo(run('01', { negrito: false, tamanho: 10 }), { espacoDepois: 0 })}
  `;

  const bordas = `
    <w:tblBorders>
      <w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/>
      <w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/>
    </w:tblBorders>`;
  const tblPr = `<w:tblPr><w:tblW w:w="9000" w:type="dxa"/>${bordas}</w:tblPr>`;

  const row1 = `<w:tr>
    <w:tc><w:tcPr><w:tcW w:w="1600" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${IMG_XML}</w:tc>
    <w:tc><w:tcPr><w:tcW w:w="5400" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${textosInst}</w:tc>
    <w:tc><w:tcPr><w:tcW w:w="2000" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${textosDir}</w:tc>
  </w:tr>`;

  // Linha do Título mesclada (gridSpan=3)
  const row2 = `<w:tr>
    <w:tc>
      <w:tcPr><w:tcW w:w="9000" w:type="dxa"/><w:gridSpan w:val="3"/><w:vAlign w:val="center"/></w:tcPr>
      ${paragrafo(run('COMUNICAÇÃO INTERNA', { negrito: true, tamanho: 12 }), { alinhamento: 'center', espacoDepois: 0 })}
    </w:tc>
  </w:tr>`;

  return `<w:tbl>${tblPr}<w:tblGrid>${gridCols}</w:tblGrid>${row1}${row2}</w:tbl>`;
}

// ============================================
// DOCUMENTO 1 — DESPACHO
// ============================================
function montarDespachoXML(d) {
  const blocos = [];
  
  blocos.push(montarCabecalhoDespacho());
  blocos.push(paragrafo('', { espacoDepois: 200 }));

  blocos.push(tabelaCustomizada(
    [
      [{ runs: run('PROCESSO:', { negrito: true, tamanho: 10 }) }, { runs: run(d.processo || '', { tamanho: 10 }) }],
      [{ runs: run('OBJETO:', { negrito: true, tamanho: 10 }) }, { runs: run(d.objeto || '', { tamanho: 10 }) }],
      [{ runs: run('ÓRGÃO INTERESSADO:', { negrito: true, tamanho: 10 }) }, { runs: run(d.orgao || '', { tamanho: 10 }) }],
    ],
    9000,
    [3000, 6000]
  ));

  blocos.push(paragrafo('', { espacoDepois: 200 }));

  blocos.push(paragrafo(run('DESPACHO', { negrito: true, tamanho: 14 }), { alinhamento: 'center', espacoDepois: 240 }));

  blocos.push(paragrafo(run('À Coordenação de Executiva – CEIRF', { negrito: true, tamanho: 11 }), { alinhamento: 'left', espacoDepois: 240 }));

  const lote = d.lote || '01';
  blocos.push(paragrafo(
    run(`Visando atendimento ao quando solicitado no pleito inicial, encaminho para vosso conhecimento e autorização, objetivando posterior execução dos serviços descritos abaixo, através da ATA DE REGISTRO DE PREÇOS – PE nº 149D/25 - LOTE ${lote}.`, { tamanho: 11 }),
    { alinhamento: 'justify', espacoDepois: 240 }
  ));

  const linhaDados = (label, valor) => paragrafo(run(`${label}${valor}`, { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 60 });

  blocos.push(linhaDados('UNIDADE: ', `${d.unidade || ''}.`));
  blocos.push(linhaDados('ENDEREÇO DA OBRA: ', `${d.endereco || ''}`));
  blocos.push(linhaDados('EMPRESA EXECUTORA: ', `${d.empresa || ''}`));
  blocos.push(paragrafo(run(d.servico || '', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 60 }));

  const valorFmt = d.valor ? `R$ ${d.valor}` : 'R$ ________';
  const prazoFmt = d.prazo ? `${d.prazo} dias` : '____ dias';
  blocos.push(linhaDados('VALOR: ', `${valorFmt} - Prazo: ${prazoFmt}`));
  blocos.push(linhaDados('Cód. de Obra – ', `${d.codigoObra || ''}`));
  blocos.push(linhaDados('DESCONTO: ', `${d.desconto ? d.desconto + '%' : '____%'}`));
  blocos.push(linhaDados('Fiscal: ', `${d.fiscal || ''}`));

  blocos.push(paragrafo('', { espacoDepois: 240 }));
  blocos.push(paragrafo(run(d.dataExtenso || 'Salvador, 16 de novembro de 2026.', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 120 }));
  blocos.push(paragrafo(run('Atenciosamente,', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 0 }));

  return montarDocumento(blocos);
}

// ============================================
// DOCUMENTO 2 — COMUNICAÇÃO INTERNA
// ============================================
function montarComunicacaoInternaXML(d) {
  const blocos = [];
  
  blocos.push(montarCabecalhoCI(d));
  blocos.push(paragrafo('', { espacoDepois: 200 }));

  blocos.push(paragrafo(run('Destino: CEM - Coordenação de Engenharia e Manutenção da CEIRF', { negrito: true, tamanho: 11 }), { alinhamento: 'left', espacoDepois: 60 }));
  blocos.push(paragrafo(run('Att: Engº Murilo Bahiense', { negrito: true, tamanho: 11 }), { alinhamento: 'left', espacoDepois: 240 }));
  blocos.push(paragrafo(run('Senhor Coordenador,', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 240 }));

  const lote = d.lote || '01';
  const planilha = d.planilha || '16001T';
  const unidade = d.unidade || '____________________';
  const servico = d.servico || '____________________';
  blocos.push(paragrafo(
    run(`Atendendo a solicitação para os serviços de ${servico} do ${unidade}, encaminhamos em anexo para vosso conhecimento e deliberações Memória de Cálculo, Relatório Técnico, planilha Orçamentária nº ${planilha}, visando a execução dos serviços através da ATA de Registro de Preço - PE nº 149/2025 - LOTE ${lote}, que tem por objeto contratual os Serviços de Manutenção Preventiva e Corretiva das Unidades da SESAB do Estado da Bahia, na Capital, Região Metropolitana de Salvador e Municípios do Interior.`, { tamanho: 11 }),
    { alinhamento: 'justify', espacoDepois: 240 }
  ));

  blocos.push(paragrafo(run(d.dataExtenso || 'Salvador, 16 de novembro de 2026.', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 360 }));
  blocos.push(paragrafo(run(d.fiscal || 'Frede Muniz', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 0 }));
  blocos.push(paragrafo(run('CEIRF / CEM / TECMAN 04', { tamanho: 11 }), { alinhamento: 'left', espacoDepois: 0 }));

  return montarDocumento(blocos);
}

function montarDocumento(blocos) {
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
            xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
            xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
  <w:body>
    ${blocos.join('')}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;
}

// ============================================
// Pacote DOCX
// ============================================
const DOCX_PARTES_ESTATICAS = {
  '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`,
  '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`,
  'word/_rels/document.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  <Relationship Id="rIdImage1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/>
</Relationships>`,
  'word/styles.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>
        <w:sz w:val="22"/>
        <w:szCs w:val="22"/>
      </w:rPr>
    </w:rPrDefault>
    <w:pPrDefault>
      <w:pPr>
        <w:spacing w:after="0" w:line="276" w:lineRule="auto"/>
      </w:pPr>
    </w:pPrDefault>
  </w:docDefaults>
</w:styles>`,
};

// ============================================
// ZIP store mínimo
// ============================================
const tabelaCRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) crc = tabelaCRC[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

function textoParaBytes(str) { return new TextEncoder().encode(str); }
function base64ParaBytes(base64) {
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function criarZipBlob(arquivos) {
  const partes = [];
  const centralDir = [];
  let offset = 0;
  const dosTime = 0;
  const dosDate = ((1980 - 1980) << 9) | (1 << 5) | 1;

  for (const arq of arquivos) {
    const nomeBytes = textoParaBytes(arq.nome);
    const dados = arq.dados;
    const crc = crc32(dados);
    const tamanho = dados.length;

    const local = new Uint8Array(30 + nomeBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, dosTime, true); dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, tamanho, true); dv.setUint32(22, tamanho, true);
    dv.setUint16(26, nomeBytes.length, true); dv.setUint16(28, 0, true);
    local.set(nomeBytes, 30);
    partes.push(local); partes.push(dados);

    const central = new Uint8Array(46 + nomeBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true); cv.setUint32(16, crc, true); cv.setUint32(20, tamanho, true);
    cv.setUint32(24, tamanho, true); cv.setUint16(28, nomeBytes.length, true); cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true); cv.setUint16(34, 0, true); cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);
    central.set(nomeBytes, 46);
    centralDir.push(central);
    offset += local.length + dados.length;
  }

  const centralDirSize = centralDir.reduce((s, b) => s + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, arquivos.length, true); ev.setUint16(10, arquivos.length, true);
  ev.setUint32(12, centralDirSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);

  return new Blob([...partes, ...centralDir, eocd], {
    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  });
}

function gerarDocxBlob(xmlDocument) {
  const arquivos = [];
  for (const [nome, conteudo] of Object.entries(DOCX_PARTES_ESTATICAS)) {
    arquivos.push({ nome, dados: textoParaBytes(conteudo) });
  }
  arquivos.push({ nome: 'word/document.xml', dados: textoParaBytes(xmlDocument) });
  arquivos.push({ nome: 'word/media/image1.png', dados: base64ParaBytes(BRASAO_BAHIA_BASE64) });
  return criarZipBlob(arquivos);
}

// ============================================
// UI e Controle
// ============================================
function mostrarToast(msg, erro = false) {
  toast.textContent = msg;
  toast.className = 'toast show' + (erro ? ' erro' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.className = 'toast'; }, 3500);
}

function sanitizarNome(nome) {
  return nome.trim().replace(/[<>:"/\\|?*\x00-\x1F]/g, '').replace(/\s+/g, ' ').slice(0, 80);
}

function apiSuportada() { return 'showDirectoryPicker' in window; }

btnSelecionarPasta.addEventListener('click', async () => {
  if (!apiSuportada()) {
    mostrarToast('Navegador não suporta File System Access API.', true);
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' });
    if (handle.kind !== 'directory') return;
    const permissao = await handle.queryPermission({ mode: 'readwrite' });
    if (permissao !== 'granted') {
      const pedido = await handle.requestPermission({ mode: 'readwrite' });
      if (pedido !== 'granted') { mostrarToast('Permissão negada.', true); return; }
    }
    estado.pastaRaiz = handle;
    statusPasta.textContent = `📂 Pasta: ${handle.name}`;
    btnCriar.disabled = false;
    await carregarUnidadesExistentes();
    mostrarToast('Pasta selecionada!');
  } catch (err) {
    if (err.name !== 'AbortError') { console.error(err); mostrarToast('Erro ao acessar pasta.', true); }
  }
});

async function carregarUnidadesExistentes() {
  estado.unidades = [];
  listaUnidades.innerHTML = '';
  try {
    for await (const [nome, handle] of estado.pastaRaiz.entries()) {
      if (handle.kind === 'directory') estado.unidades.push(nome);
    }
  } catch (err) { console.error(err); }
  estado.unidades.forEach((nome) => renderizarUnidade(nome));
  atualizarVazio();
}

btnCriar.addEventListener('click', async () => {
  const nome = sanitizarNome(inputNome.value);
  if (!nome) { mostrarToast('Digite um nome válido.', true); return; }
  if (!estado.pastaRaiz) { mostrarToast('Selecione uma pasta primeiro.', true); return; }
  const existente = estado.unidades.find(u => u.toLowerCase() === nome.toLowerCase());
  if (existente) { mostrarToast(`A unidade "${existente}" já existe.`, true); return; }

  const dataRaw = campoData.value.trim();
  const dataExtenso = dataRaw ? `Salvador, ${dataRaw.replace(/\//g, ' de ')}.` : 'Salvador, 16 de novembro de 2026.';

  const dados = {
    unidade: nome, endereco: campoEndereco.value.trim(), servico: campoServico.value.trim(),
    valor: campoValor.value.trim(), prazo: campoPrazo.value.trim(), fiscal: campoFiscal.value.trim(),
    empresa: campoEmpresa.value.trim(), codigoObra: campoCodigoObra.value.trim(), desconto: campoDesconto.value.trim(),
    processo: campoProcesso.value.trim(), objeto: campoObjeto.value.trim(), orgao: campoOrgao.value.trim(),
    lote: campoLote.value.trim(), numeroCI: campoNumeroCI.value.trim(), dataCI: dataRaw,
    planilha: campoPlanilha.value.trim(), dataExtenso,
  };

  try {
    const pastaUnidade = await estado.pastaRaiz.getDirectoryHandle(nome, { create: true });
    const pastasSub = {};
    for (const sub of SUBPASTAS) pastasSub[sub] = await pastaUnidade.getDirectoryHandle(sub, { create: true });

    const numero = dados.numeroCI || '719-2026';
    const empresa = (dados.empresa || 'EMPRESA').toUpperCase().replace(/\s+/g, ' ');

    const docs = [
      { nomeArquivo: `CI ${numero} - DESP ${empresa}.docx`, xml: montarDespachoXML(dados) },
      { nomeArquivo: `CI n${numero}.docx`, xml: montarComunicacaoInternaXML(dados) },
    ];

    const pastaWord = pastasSub['Documentos Word'];
    for (const doc of docs) {
      const blob = gerarDocxBlob(doc.xml);
      const arquivo = await pastaWord.getFileHandle(doc.nomeArquivo, { create: true });
      const writable = await arquivo.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    estado.unidades.push(nome);
    renderizarUnidade(nome, dados);
    atualizarVazio();

    [inputNome, campoEndereco, campoServico, campoValor, campoPrazo, campoFiscal,
     campoEmpresa, campoCodigoObra, campoDesconto, campoProcesso, campoObjeto,
     campoOrgao, campoLote, campoNumeroCI, campoData, campoPlanilha].forEach(el => { if (el) el.value = ''; });
    inputNome.focus();

    mostrarToast(`Unidade "${nome}" criada com sucesso!`);
  } catch (err) {
    console.error(err);
    mostrarToast('Erro ao criar a pasta: ' + err.message, true);
  }
});

inputNome.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !btnCriar.disabled) btnCriar.click();
});

function renderizarUnidade(nome, dados = null) {
  const li = document.createElement('li');
  const info = document.createElement('div'); info.className = 'info';
  const spanNome = document.createElement('span'); spanNome.className = 'nome'; spanNome.textContent = '🏥 ' + nome;
  const spanSub = document.createElement('span'); spanSub.className = 'subpastas'; spanSub.textContent = '📄 ' + SUBPASTAS.join('   •   ') + '  (Word já populado)';
  info.appendChild(spanNome); info.appendChild(spanSub);
  if (dados && (dados.servico || dados.empresa || dados.fiscal)) {
    const spanDet = document.createElement('span'); spanDet.className = 'detalhes';
    const partes = [];
    if (dados.servico) partes.push('Serviço: ' + dados.servico);
    if (dados.empresa) partes.push('Empresa: ' + dados.empresa);
    if (dados.fiscal) partes.push('Fiscal: ' + dados.fiscal);
    if (dados.valor) partes.push('Valor: R$ ' + dados.valor);
    spanDet.textContent = '🔧 ' + partes.join('   |   ');
    info.appendChild(spanDet);
  }
  li.appendChild(info); listaUnidades.appendChild(li);
}

function atualizarVazio() {
  vazio.style.display = estado.unidades.length === 0 ? 'block' : 'none';
}

(function init() {
  if (!apiSuportada()) {
    btnSelecionarPasta.disabled = true;
    statusPasta.textContent = '⚠️ Navegador incompatível.';
  }
  atualizarVazio();
})();
</script>
